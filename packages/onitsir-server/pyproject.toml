[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onitsir-server"
version = "1.0.0"
description = "FastAPI bridge exposing onitsir-core's Engine/Roster/Router/Governor over the /api/* contract agentosirus-web already speaks, plus WS mission streaming. Modeled on ADROS's and AgentOmega's server.py split (REST + WS)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Dante Bullock" }]
maintainers = [{ name = "Dante Bullock" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "onitsir-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Fame510/ONITSIR-WORKFORCE"
Repository = "https://github.com/Fame510/ONITSIR-WORKFORCE"
Issues = "https://github.com/Fame510/ONITSIR-WORKFORCE/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]
