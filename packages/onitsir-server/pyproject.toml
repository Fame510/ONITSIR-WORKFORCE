[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onitsir-server"
version = "1.0.0"
description = "FastAPI bridge exposing onitsir-core's Engine/Roster/Router/Governor over the /api/* contract agentosirus-web already speaks, plus WS mission streaming. Modeled on ADROS's and AgentOmega's server.py split (REST + WS)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onitsir-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]
