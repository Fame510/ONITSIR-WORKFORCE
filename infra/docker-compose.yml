# infra/docker-compose.yml
#
# Deployment topology (architecture doc section 2.3, item 7): two processes --
# onitsir-server (Python, FastAPI, owns Roster/Governor/Workflow/Engine state)
# and agentosirus-web (Vite/React static build plus an optional Node companion
# for privileged actions) -- reverse-proxied together so the browser only ever
# talks to one origin.
#
# Run from this directory:
#
#   docker compose up --build
#
# SECURITY: onitsir-server has no authentication, no authorization and no rate
# limiting on any route, including the WebSocket endpoint, and CORS is open.
# Everything below binds to 127.0.0.1 for that reason. Do not change those port
# bindings to 0.0.0.0 without putting an authenticating proxy in front. See
# ../SECURITY.md.
#
# The `version` key is intentionally omitted: it is obsolete in Compose v2 and
# emits a warning.

services:
  onitsir-server:
    build:
      # Context is the repository root because onitsir-server installs
      # onitsir-core from a sibling path. A narrower context cannot see it.
      context: ..
      dockerfile: infra/Dockerfile.onitsir-server
    environment:
      - ONITSIR_SHACKLE_RULES=/app/data/shackle_rules/onitsir-baseline.shackle.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Rules and roster are read-only inputs.
      - ../packages/onitsir-core/data:/app/data:ro
      # Writable state. Mission state itself is in-memory and process-local, so
      # this does not survive a restart as mission history -- it exists so that
      # anything the server does persist has a durable home outside the
      # container layer.
      - onitsir-state:/app/var
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agentosirus-web:
    build:
      context: ../packages/agentosirus-web
      dockerfile: ../../infra/Dockerfile.agentosirus-web
    environment:
      # Browser-visible. Requests go through nginx on port 80, so this is the
      # proxied origin rather than the container-internal one.
      - VITE_BACKEND_URL=http://localhost
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      onitsir-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  companion:
    build:
      context: ../packages/agentosirus-web/companion
      dockerfile: ../../../infra/Dockerfile.companion
    environment:
      - ONITSIR_BACKEND_URL=http://onitsir-server:8000
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      onitsir-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      onitsir-server:
        condition: service_healthy
      agentosirus-web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Without this, every restart discards all collected series.
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  onitsir-state:
  prometheus-data:
