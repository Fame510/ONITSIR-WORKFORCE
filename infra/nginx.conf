# infra/nginx.conf — reverse proxy so the browser only ever talks to one
# origin (architecture doc section 2.3, item 7; pattern ported from ADROS's
# Nginx + FastAPI Docker Compose setup).
events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://onitsir-server:8000;
      proxy_set_header Host $host;
    }

    location /ws/ {
      proxy_pass http://onitsir-server:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://agentosirus-web:4173;
      proxy_set_header Host $host;
    }
  }
}
