name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onitsir-core:
    name: onitsir-core (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install onitsir-core (crypto + dev extras)
        working-directory: packages/onitsir-core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[crypto,dev]"

      - name: Run onitsir-core test suite
        working-directory: packages/onitsir-core
        run: python -m pytest tests/ -v

      - name: Smoke-test the onitsir CLI against the real 164-entry roster
        working-directory: packages/onitsir-core
        run: |
          onitsir roster
          onitsir crew "launch a mobile game on iOS and Android"
          onitsir run "ship a landing page"
          onitsir shackle
          onitsir shackle-rules
          onitsir ethics
          onitsir conformance
          onitsir swarm-demo

  onitsir-server:
    name: onitsir-server (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install onitsir-core then onitsir-server
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/onitsir-core[crypto]"
          pip install -e "./packages/onitsir-server[dev]"
          pip install "httpx>=0.27"

      - name: Run onitsir-server test suite
        working-directory: packages/onitsir-server
        run: python -m pytest tests/ -v

  agentosirus-web:
    name: agentosirus-web (vitest + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/agentosirus-web/package-lock.json

      - name: Install dependencies
        working-directory: packages/agentosirus-web
        run: npm ci

      - name: Build the unified agent index and roster.json (SYNERGY 1)
        working-directory: packages/agentosirus-web
        run: npm run build:index

      - name: Run vitest suite
        working-directory: packages/agentosirus-web
        run: npm run test

      - name: TypeScript strict-mode compile
        working-directory: packages/agentosirus-web
        run: npm run lint

      - name: Provider contract conformance (SYNERGY 20)
        working-directory: packages/agentosirus-web
        run: npm run conformance:check

      - name: Production Vite build
        working-directory: packages/agentosirus-web
        run: npm run build

  shackle-type-sync:
    name: shackle type drift check (SYNERGY 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Verdict/DenyReason/HitlMode are in sync
        run: node infra/scripts/sync-shackle-types.mjs --check

  all-green:
    name: all green
    runs-on: ubuntu-latest
    needs: [onitsir-core, onitsir-server, agentosirus-web, shackle-type-sync]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "ONITSIR-WORKFORCE: all jobs green."
